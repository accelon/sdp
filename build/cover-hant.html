<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>法華合注 · 封面</title>
<style>
  :root{--paper:#f6f1e7;--ink:#1b1814;--soft:#3a332a;--muted:#6d6357;--line:#ddd0bc;--accent:#8c3b2c;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;background:var(--paper);color:var(--ink);font-family:"Noto Serif TC","Source Han Serif TC","Songti TC","Songti SC",STSong,serif;position:relative;overflow:hidden}
  .in{padding:74px 80px}
  .kick{font-size:16px;letter-spacing:.36em;color:var(--accent);font-weight:700}
  h1{font-size:96px;line-height:1.06;letter-spacing:.05em;margin-top:22px}
  .sub{font-size:26px;line-height:1.6;color:var(--soft);margin-top:18px}
  .stats{display:flex;gap:44px;margin-top:38px}
  .stats b{display:block;font-size:40px;line-height:1.05;color:var(--accent);font-weight:800}
  .stats span{display:block;font-size:15px;color:var(--muted);margin-top:5px}
  .seal{position:absolute;right:80px;top:74px;border:3px solid var(--accent);color:var(--accent);width:96px;height:96px;display:grid;place-items:center;font-size:22px;line-height:1.05;letter-spacing:.1em;writing-mode:vertical-rl;text-orientation:upright;padding:9px}
  .bar{position:absolute;left:0;right:0;bottom:0;height:14px;background:var(--accent)}
</style>
</head>
<body>
<div class="in">
  <div class="kick">書同軌 · 法華合注</div>
  <h1>法華合注</h1>
  <div class="sub">七卷二十八品，三種漢譯，二十六家注；<br>把苦功夫交給 AI，把學問留給老師。</div>
  <div class="stats">
    <div><b>89%</b><span>《科註》可逐句錨定</span></div>
    <div><b>60h→14h</b><span>一品的備課</span></div>
    <div><b>26 家</b><span>注疏・547 萬字</span></div>
  </div>
</div>
<div class="seal">法華</div>
<div class="bar"></div>
</body>
</html>
